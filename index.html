<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가성비 맥주 계산기</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #1e88e5; margin-bottom: 24px; }
    .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 2px solid transparent; transition: all 0.3s; }
    .card.best { border-color: #ffb300; background-color: #fffdf2; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    input, select { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; outline: none; background: white; }
    input[type="number"], input[type="text"] { margin-bottom: 10px; }
    .row input { margin-bottom: 0; }
    .result { font-weight: bold; color: #555; margin-bottom: 10px; font-size: 14px; }
    button { border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    .delete-btn { background-color: #ffebee; color: #c62828; }
    .add-btn { background-color: #1e88e5; color: white; margin-bottom: 10px; }
    .reset-btn { background-color: #e0e0e0; color: #333; }
    .badge { display: inline-block; background: #ffb300; color: white; padding: 4px 8px; border-radius: 8px; font-size: 12px; margin-bottom: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍺 맥주픽</h1>
    <div id="beerList"></div>
    <button class="add-btn" onclick="addBeer()">+ 맥주 추가</button>
    <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
  </div>

  <script>
    let beerList = JSON.parse(localStorage.getItem("beerData")) || [];

    function save() {
      localStorage.setItem("beerData", JSON.stringify(beerList));
    }

    function format(n) {
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    function createCard(beer, index) {
      const card = document.createElement("div");
      card.className = "card";

      // 🍺 자주 마시는 맥주 목록
      const beerOptions = ["카스", "테라", "켈리", "하이트", "클라우드", "오비라거"];
      
      let isCustom = beer.name && !beerOptions.includes(beer.name);
      let selectedValue = isCustom ? "직접입력" : (beer.name || "");

      card.innerHTML = `
        <div class="best-badge" style="display: none;"><span class="badge">👑 100ml당 최저가</span></div>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <select class="beer-select" style="flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; outline: none; background: white;">
            <option value="">맥주 선택</option>
            ${beerOptions.map(b => `<option value="${b}" ${selectedValue === b ? 'selected' : ''}>${b}</option>`).join('')}
            <option value="직접입력" ${isCustom || selectedValue === '직접입력' ? 'selected' : ''}>직접 입력...</option>
          </select>
          <input class="name-input" placeholder="맥주 직접 입력" value="${isCustom ? beer.name : ''}" style="display: ${isCustom ? 'block' : 'none'}; flex: 1; margin: 0; padding: 14px; border-radius: 12px; border: 1px solid #ccc;">
        </div>
        <div class="row">
          <input class="vol-input" type="number" placeholder="용량 (ml)" value="${beer.volume || ""}">
          <input class="count-input" type="number" placeholder="개수" value="${beer.count || ""}">
        </div>
        <input class="price-input" type="text" placeholder="가격 (원)" value="${beer.price ? format(beer.price) : ""}">
        <div class="result"></div>
        <button class="delete-btn">삭제</button>
      `;

      const beerSelect = card.querySelector(".beer-select");
      const nameInput = card.querySelector(".name-input");
      const volInput = card.querySelector(".vol-input");
      const countInput = card.querySelector(".count-input");
      const priceInput = card.querySelector(".price-input");

      function update() {
        beer.name = (beerSelect.value === "직접입력") ? nameInput.value : beerSelect.value;
        beer.volume = volInput.value;
        beer.count = countInput.value;

        let raw = priceInput.value.replace(/,/g,"");
        beer.price = raw;

        if (raw) priceInput.value = format(raw);

        highlightBest();
        save();
      }

      beerSelect.addEventListener("change", (e) => {
        if (e.target.value === "직접입력") {
          nameInput.style.display = "block";
          nameInput.focus();
        } else {
          nameInput.style.display = "none";
          nameInput.value = "";
        }
        update();
      });

      nameInput.addEventListener("input", update);
      volInput.addEventListener("input", update);
      countInput.addEventListener("input", update);
      priceInput.addEventListener("input", update);

      card.querySelector(".delete-btn").onclick = () => {
        beerList.splice(index, 1);
        render();
        save();
      };

      // 💡 수정한 부분: document.getElementById... 대신 return card; 로 변경
      return card;
    }

    function highlightBest() {
      let bestIndex = -1;
      let bestValue = Infinity;

      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        card.classList.remove("best");
        const badge = card.querySelector(".best-badge");
        if(badge) badge.style.display = "none";
        const resultDiv = card.querySelector(".result");
        if(resultDiv) resultDiv.innerText = "";
      });

      beerList.forEach((b, i) => {
        const v = parseFloat(b.volume);
        const c = parseFloat(b.count);
        const p = parseFloat(b.price);

        if (v && c && p) {
          const val = (p / (v * c)) * 100;
          
          const resultDiv = cards[i].querySelector(".result");
          if(resultDiv) resultDiv.innerText = `100ml당 약 ${Math.round(val).toLocaleString()}원`;

          if (val < bestValue) {
            bestValue = val;
            bestIndex = i;
          }
        }
      });

      if (bestIndex !== -1 && cards[bestIndex]) {
        cards[bestIndex].classList.add("best");
        const badge = cards[bestIndex].querySelector(".best-badge");
        if(badge) badge.style.display = "block";
      }
    }

    function render() {
      const container = document.getElementById("beerList");
      container.innerHTML = "";

      beerList.forEach((beer, i) => {
        container.appendChild(createCard(beer, i));
      });

      highlightBest();
    }

    function addBeer() {
      beerList.push({});
      render();
      save();
    }

    function resetAll() {
      if (confirm("초기화할까요?")) {
        beerList = [];
        render();
        save();
      }
    }

    // ✅ PWA 서비스워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('Service Worker Error', err));
    }

    if (beerList.length === 0) {
      addBeer();
    } else {
      render();
    }
  </script>
</body>
</html>
