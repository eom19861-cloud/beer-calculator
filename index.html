<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가성비 맥주 계산기</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
    .container { max-width: 500px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; color: #1e88e5; margin-bottom: 24px; }
    
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px solid transparent; transition: all 0.3s; }
    .card.best { border-color: #ffb300; background-color: #fffdf2; }
    
    .chip-container { margin-bottom: 16px; }
    .chip-label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; font-weight: bold; }
    
    /* 가로 스크롤 허용 (부드러운 스크롤) */
    .chip-group { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      padding-bottom: 4px; 
      -webkit-overflow-scrolling: touch; 
    }
    .chip-group::-webkit-scrollbar { display: none; } /* 스크롤바 숨김 */
    
    .chip { 
      flex-shrink: 0; 
      padding: 10px 14px; 
      border: 1px solid #d1d5db; 
      border-radius: 24px; 
      background: white; 
      color: #374151; 
      font-size: 14px; 
      cursor: pointer; 
      -webkit-tap-highlight-color: transparent; 
      transition: 0.2s; 
    }
    .chip.active { background: #1e88e5; color: white; border-color: #1e88e5; font-weight: bold; }
    
    input { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; outline: none; background: #fafafa; }
    input:focus { border-color: #1e88e5; background: white; }
    .custom-input { margin-top: 8px; }
    
    .result { font-weight: bold; color: #333; margin-top: 16px; margin-bottom: 12px; font-size: 15px; text-align: right; }
    
    button.action-btn { border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
    .delete-btn { background-color: #ffebee; color: #c62828; }
    .add-btn { background-color: #1e88e5; color: white; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(30,136,229,0.2); }
    .reset-btn { background-color: #e0e0e0; color: #555; }
    .badge { display: inline-block; background: #ffb300; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍺 맥주픽</h1>
    <div id="beerList"></div>
    <button class="action-btn add-btn" onclick="addBeer()">+ 새로운 맥주 추가</button>
    <button class="action-btn reset-btn" onclick="resetAll()">전체 초기화</button>
  </div>

  <script>
    let beerList = JSON.parse(localStorage.getItem("beerData")) || [];

    function save() { localStorage.setItem("beerData", JSON.stringify(beerList)); }
    function format(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

    function createCard(beer, index) {
      const card = document.createElement("div");
      card.className = "card";

      // 🍺 브랜드, 용량(오름차순), 개수 설정
      const brands = ["카스", "테라", "켈리", "하이트", "클라우드", "버드와이저", "호가든", "하이네켄", "아사히", "기네스", "칭따오"];
      const volumes = ["330", "340", "350", "355", "360", "370", "400", "443", "453", "473", "480", "500"]; 
      const counts = ["4", "6", "8"];
      
      let isCustomBrand = beer.name && !brands.includes(beer.name);
      let isCustomVol = beer.volume && !volumes.includes(beer.volume.toString());
      let isCustomCount = beer.count && !counts.includes(beer.count.toString());

      card.innerHTML = `
        <div class="best-badge" style="display: none;"><span class="badge">👑 100ml당 최저가</span></div>
        
        <div class="chip-container">
          <span class="chip-label">1. 맥주 종류</span>
          <div class="chip-group brand-group">
            ${brands.map(b => `<button type="button" class="chip ${beer.name === b ? 'active' : ''}" data-val="${b}">${b}</button>`).join('')}
            <button type="button" class="chip ${isCustomBrand ? 'active' : ''}" data-val="custom">직접입력</button>
          </div>
          <input class="custom-input name-input" type="text" placeholder="맥주 이름 직접 입력" value="${isCustomBrand ? beer.name : ''}" style="display: ${isCustomBrand ? 'block' : 'none'};">
        </div>

        <div class="chip-container">
          <span class="chip-label">2. 한 캔(병) 용량</span>
          <div class="chip-group vol-group">
            ${volumes.map(v => `<button type="button" class="chip ${beer.volume == v ? 'active' : ''}" data-val="${v}">${v}ml</button>`).join('')}
            <button type="button" class="chip ${isCustomVol ? 'active' : ''}" data-val="custom">직접입력</button>
          </div>
          <input class="custom-input vol-input" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="용량(ml) 직접 입력" value="${isCustomVol ? beer.volume : ''}" style="display: ${isCustomVol ? 'block' : 'none'};">
        </div>

        <div class="chip-container">
          <span class="chip-label">3. 개수</span>
          <div class="chip-group count-group">
            ${counts.map(c => `<button type="button" class="chip ${beer.count == c ? 'active' : ''}" data-val="${c}">${c}개</button>`).join('')}
            <button type="button" class="chip ${isCustomCount ? 'active' : ''}" data-val="custom">직접입력</button>
          </div>
          <input class="custom-input count-input" type="number" inputmode="numeric" pattern="[0-9]*" placeholder="개수 직접 입력" value="${isCustomCount ? beer.count : ''}" style="display: ${isCustomCount ? 'block' : 'none'};">
        </div>

        <div class="chip-container" style="margin-bottom: 0;">
          <span class="chip-label">4. 총 가격 (원)</span>
          <input class="price-input" type="text" inputmode="numeric" placeholder="결제할 총 가격 입력" value="${beer.price ? format(beer.price) : ""}">
        </div>

        <div class="result"></div>
        <button class="action-btn delete-btn">이 항목 삭제</button>
      `;

      const brandChips = card.querySelectorAll(".brand-group .chip");
      const volChips = card.querySelectorAll(".vol-group .chip");
      const countChips = card.querySelectorAll(".count-group .chip");
      
      const nameInput = card.querySelector(".name-input");
      const volInput = card.querySelector(".vol-input");
      const countInput = card.querySelector(".count-input");
      const priceInput = card.querySelector(".price-input");

      function update() {
        const activeBrand = card.querySelector(".brand-group .chip.active");
        if (activeBrand) beer.name = activeBrand.dataset.val === "custom" ? nameInput.value : activeBrand.dataset.val;

        const activeVol = card.querySelector(".vol-group .chip.active");
        if (activeVol) beer.volume = activeVol.dataset.val === "custom" ? volInput.value : activeVol.dataset.val;

        const activeCount = card.querySelector(".count-group .chip.active");
        if (activeCount) beer.count = activeCount.dataset.val === "custom" ? countInput.value : activeCount.dataset.val;

        let raw = priceInput.value.replace(/,/g,"");
        beer.price = raw;

        if (raw) priceInput.value = format(raw);

        highlightBest();
        save();
      }

      // 브랜드 칩 이벤트
      brandChips.forEach(chip => {
        chip.addEventListener("click", () => {
          brandChips.forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          if (chip.dataset.val === "custom") {
            nameInput.style.display = "block"; nameInput.focus();
          } else {
            nameInput.style.display = "none";
          }
          update();
        });
      });

      // 용량 칩 이벤트
      volChips.forEach(chip => {
        chip.addEventListener("click", () => {
          volChips.forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          if (chip.dataset.val === "custom") {
            volInput.style.display = "block"; volInput.focus();
          } else {
            volInput.style.display = "none";
          }
          update();
        });
      });

      // 개수 칩 이벤트
      countChips.forEach(chip => {
        chip.addEventListener("click", () => {
          countChips.forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          if (chip.dataset.val === "custom") {
            countInput.style.display = "block"; countInput.focus();
          } else {
            countInput.style.display = "none";
          }
          update();
        });
      });

      nameInput.addEventListener("input", update);
      volInput.addEventListener("input", update);
      countInput.addEventListener("input", update);
      priceInput.addEventListener("input", update);

      card.querySelector(".delete-btn").onclick = () => {
        beerList.splice(index, 1);
        render();
        save();
      };

      return card;
    }

    function highlightBest() {
      let bestIndex = -1;
      let bestValue = Infinity;

      const cards = document.querySelectorAll(".card");
      cards.forEach(card => {
        card.classList.remove("best");
        const badge = card.querySelector(".best-badge");
        if(badge) badge.style.display = "none";
        const resultDiv = card.querySelector(".result");
        if(resultDiv) resultDiv.innerText = "";
      });

      beerList.forEach((b, i) => {
        const v = parseFloat(b.volume);
        const c = parseFloat(b.count);
        const p = parseFloat(b.price);

        if (v && c && p) {
          const val = (p / (v * c)) * 100;
          
          const resultDiv = cards[i].querySelector(".result");
          if(resultDiv) resultDiv.innerHTML = `100ml 당 <span style="color:#1e88e5;">${Math.round(val).toLocaleString()}원</span>`;

          if (val < bestValue) {
            bestValue = val;
            bestIndex = i;
          }
        }
      });

      if (bestIndex !== -1 && cards[bestIndex]) {
        cards[bestIndex].classList.add("best");
        const badge = cards[bestIndex].querySelector(".best-badge");
        if(badge) badge.style.display = "block";
      }
    }

    function render() {
      const container = document.getElementById("beerList");
      container.innerHTML = "";
      beerList.forEach((beer, i) => container.appendChild(createCard(beer, i)));
      highlightBest();
    }

    function addBeer() {
      beerList.push({});
      render();
      save();
    }

    function resetAll() {
      if (confirm("모든 목록을 초기화할까요?")) {
        beerList = [];
        render();
        save();
      }
    }

    // ✅ PWA 서비스워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('Service Worker Error', err));
    }

    if (beerList.length === 0) addBeer();
    else render();
  </script>
</body>
</html>
